spring:
  profiles:
    default: all
  data:
    redis:
      connect-timeout: 100ms
      timeout: 100ms
  servlet:
    multipart:
      max-file-size: 64KB
      max-request-size: 64KB
  task:
    scheduling:
      pool:
        size: 4

server:
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

management:
  defaults:
    metrics:
      export:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
      otlp:
        enabled: false
  opentelemetry:
    logging:
      export:
        otlp:
          enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

flash-booking:
  security:
    max-request-body-size: 64KB

reservation:
  hold-duration: 10m
  expiration-reconciliation:
    batch-size: 1000
    fixed-delay: 500ms

idempotency:
  cleanup:
    batch-size: 500
    fixed-delay: 5s
    initial-delay: 5s

operational-data:
  cleanup:
    batch-size: 500
    retention: 7d
    fixed-delay: 1h
    initial-delay: 1h

executive-summary:
  bedrock:
    region: ${AWS_REGION:sa-east-1}
    model-id: ${EXECUTIVE_SUMMARY_MODEL_ID:amazon.nova-micro-v1:0}
    api-timeout: 25s
