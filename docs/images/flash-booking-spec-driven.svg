<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Desenvolvimento orientado por especificação do Flash Booking</title>
  <desc id="desc">A lane da demo percorreu case, especificação, design e ADRs, 29 tarefas, 94 testes e verificador independente até 43 de 43 critérios aprovados. A lane high-load reutiliza o mesmo core e permanece planejada, sem aplicação ou validação remota.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b879d"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 750; letter-spacing: 2px; }
      .title { font-size: 42px; font-weight: 760; }
      .subtitle { font-size: 21px; }
      .lane { font-size: 20px; font-weight: 750; }
      .step { font-size: 21px; font-weight: 730; }
      .fact { font-size: 17px; }
      .small { font-size: 15px; }
      .number { font-size: 28px; font-weight: 780; }
    </style>
  </defs>

  <rect width="1600" height="700" rx="30" fill="#f4f7fa"/>
  <g class="sans">
    <text x="64" y="58" class="eyebrow" fill="#1168bd">SPEC-DRIVEN DEVELOPMENT · TL;DR</text>
    <text x="64" y="108" class="title" fill="#17324d">Da intenção à evidência, sem pular etapas</text>
    <text x="64" y="145" class="subtitle" fill="#557086">A spec define o resultado; tarefas, gates e um verificador independente mostram o que foi realmente entregue.</text>
  </g>

  <g class="sans">
    <rect x="64" y="184" width="250" height="42" rx="21" fill="#1f7a63"/>
    <circle cx="91" cy="205" r="8" fill="#74dbb6"/>
    <text x="111" y="212" class="lane" fill="#ffffff">DEMO · CONCLUÍDA</text>
  </g>

  <g class="sans" filter="url(#shadow)">
    <rect x="64" y="252" width="200" height="150" rx="20" fill="#ffffff"/>
    <circle cx="96" cy="284" r="18" fill="#dcecff"/>
    <text x="90" y="291" class="step" fill="#1168bd">1</text>
    <text x="124" y="292" class="step" fill="#17324d">Case</text>
    <text x="88" y="332" class="fact" fill="#557086">Problema e limites</text>
    <text x="88" y="360" class="fact" fill="#557086">do domínio</text>
    <text x="88" y="386" class="small" fill="#7b92a5">5 endpoints</text>

    <rect x="314" y="252" width="200" height="150" rx="20" fill="#ffffff"/>
    <circle cx="346" cy="284" r="18" fill="#dcecff"/>
    <text x="340" y="291" class="step" fill="#1168bd">2</text>
    <text x="374" y="292" class="step" fill="#17324d">Spec</text>
    <text x="338" y="342" class="number" fill="#1168bd">7</text>
    <text x="376" y="340" class="fact" fill="#557086">requisitos EARS</text>
    <text x="338" y="376" class="small" fill="#7b92a5">critérios observáveis</text>

    <rect x="564" y="252" width="200" height="150" rx="20" fill="#ffffff"/>
    <circle cx="596" cy="284" r="18" fill="#dcecff"/>
    <text x="590" y="291" class="step" fill="#1168bd">3</text>
    <text x="624" y="292" class="step" fill="#17324d">Design</text>
    <text x="588" y="342" class="number" fill="#1168bd">13</text>
    <text x="638" y="340" class="fact" fill="#557086">ADRs</text>
    <text x="588" y="376" class="small" fill="#7b92a5">decisões + trade-offs</text>

    <rect x="814" y="252" width="200" height="150" rx="20" fill="#ffffff"/>
    <circle cx="846" cy="284" r="18" fill="#dcecff"/>
    <text x="840" y="291" class="step" fill="#1168bd">4</text>
    <text x="874" y="292" class="step" fill="#17324d">Tarefas</text>
    <text x="838" y="342" class="number" fill="#1168bd">29</text>
    <text x="886" y="340" class="fact" fill="#557086">atômicas</text>
    <text x="838" y="376" class="small" fill="#7b92a5">dependências explícitas</text>

    <rect x="1064" y="252" width="200" height="150" rx="20" fill="#ffffff"/>
    <circle cx="1096" cy="284" r="18" fill="#dcecff"/>
    <text x="1090" y="291" class="step" fill="#1168bd">5</text>
    <text x="1124" y="292" class="step" fill="#17324d">Gates</text>
    <text x="1088" y="342" class="number" fill="#1168bd">94</text>
    <text x="1138" y="340" class="fact" fill="#557086">testes</text>
    <text x="1088" y="376" class="small" fill="#7b92a5">baseline integral histórico</text>

    <rect x="1314" y="240" width="222" height="174" rx="22" fill="#e8f7f1" stroke="#55a58b" stroke-width="2"/>
    <circle cx="1350" cy="276" r="21" fill="#26866a"/>
    <path d="M1340 276 l7 7 15-18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1384" y="284" class="step" fill="#17483c">Verificador</text>
    <text x="1340" y="342" class="number" fill="#1f7a63">43/43</text>
    <text x="1441" y="340" class="fact" fill="#356557">PASS</text>
    <text x="1340" y="378" class="small" fill="#356557">autor ≠ verificador</text>
  </g>

  <g fill="none" stroke="#6b879d" stroke-width="3" marker-end="url(#arrow)">
    <path d="M264 327 H303"/>
    <path d="M514 327 H553"/>
    <path d="M764 327 H803"/>
    <path d="M1014 327 H1053"/>
    <path d="M1264 327 H1303"/>
  </g>

  <g class="sans">
    <rect x="64" y="454" width="276" height="42" rx="21" fill="#5c7183"/>
    <path d="M88 475 L98 486 L111 462" fill="none" stroke="#dbe7f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="482" class="lane" fill="#ffffff">HIGH-LOAD · PLANO</text>

    <rect x="64" y="522" width="220" height="104" rx="18" fill="#e8f4ff" stroke="#8fc3ee"/>
    <text x="88" y="560" class="step" fill="#17324d">Mesmo core Java</text>
    <text x="88" y="591" class="small" fill="#557086">domínio · schema · APIs</text>

    <path d="M284 574 H328" fill="none" stroke="#6b879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="340" y="522" width="190" height="104" rx="18" fill="#ffffff" stroke="#a9bdcc"/>
    <text x="364" y="560" class="step" fill="#17324d">Spec</text>
    <text x="364" y="591" class="fact" fill="#557086">5 requisitos</text>

    <path d="M530 574 H574" fill="none" stroke="#6b879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="586" y="522" width="230" height="104" rx="18" fill="#ffffff" stroke="#a9bdcc"/>
    <text x="610" y="560" class="step" fill="#17324d">Design alvo</text>
    <text x="610" y="591" class="fact" fill="#557086">Multi-AZ + autoscaling</text>

    <path d="M816 574 H860" fill="none" stroke="#6b879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="872" y="522" width="210" height="104" rx="18" fill="#ffffff" stroke="#a9bdcc"/>
    <text x="896" y="560" class="step" fill="#17324d">20 tarefas</text>
    <text x="896" y="591" class="fact" fill="#557086">estado Draft</text>

    <path d="M1082 574 H1126" fill="none" stroke="#6b879d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1138" y="510" width="398" height="128" rx="20" fill="#fff5d9" stroke="#d5a440"/>
    <circle cx="1175" cy="548" r="20" fill="#b47a08"/>
    <rect x="1168" y="538" width="14" height="20" rx="2" fill="#ffffff"/>
    <text x="1210" y="555" class="step" fill="#674b13">Parada intencional</text>
    <text x="1166" y="592" class="fact" fill="#765c27">sem apply, benchmark ou failover remoto</text>
    <text x="1166" y="619" class="small" fill="#8b713e">arquitetura descrita ≠ comportamento comprovado</text>
  </g>
</svg>
