<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Flash Booking — evidência histórica de rajadas na borda AWS</title>
  <desc id="desc">Resumo dos targets de WAF e API Gateway e das respostas observadas em rajadas assinadas na demo AWS. Os resultados são históricos, de melhor esforço, e não constituem teste DDoS ou capacidade sustentável.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBFF"/><stop offset="1" stop-color="#EDF6FC"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#102A43"/><stop offset="1" stop-color="#204986"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16375B" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#47718F"/></marker>
    <style>
      .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.eyebrow{font-size:15px;font-weight:750;letter-spacing:1.6px}.title{font-size:35px;font-weight:760}.subtitle{font-size:17px}.cardTitle{font-size:20px;font-weight:740}.body{font-size:17px}.metric{font-size:29px;font-weight:780}.small{font-size:15px}.pill{font-size:13px;font-weight:760;letter-spacing:.7px}.flow{fill:none;stroke:#47718F;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="860" rx="28" fill="url(#page)"/>
  <rect x="28" y="22" width="1544" height="126" rx="22" fill="url(#header)"/>
  <g class="sans">
    <text x="64" y="60" class="eyebrow" fill="#9FC8F3">EVIDÊNCIA REMOTA HISTÓRICA · DEMO AWS · 11 SET 2026</text>
    <text x="64" y="106" class="title" fill="#FFFFFF">Rajadas na borda: configuração e resultado observado</text>
    <text x="64" y="132" class="subtitle" fill="#DDEEFF">As chamadas usaram IAM/SigV4. A observação confirma comportamento da demo, não constitui garantia de capacidade.</text>
    <rect x="1265" y="52" width="260" height="48" rx="24" fill="#FFF2D9"/>
    <text x="1295" y="82" class="pill" fill="#775200">NÃO É TESTE DDOS</text>
  </g>

  <g class="sans" filter="url(#shadow)">
    <rect x="64" y="190" width="1472" height="140" rx="18" fill="#FFFFFF" stroke="#A8C9E3"/>
    <rect x="88" y="214" width="410" height="92" rx="14" fill="#EDF6FF" stroke="#8FC3EE"/>
    <text x="112" y="244" class="eyebrow" fill="#1168BD">TARGETS API GATEWAY</text>
    <text x="112" y="276" class="body" fill="#17324D">GET: 20 req/s · burst 40</text>
    <text x="112" y="300" class="body" fill="#17324D">POST / DELETE: 5 req/s · burst 10</text>
    <rect x="544" y="214" width="410" height="92" rx="14" fill="#FFF5DF" stroke="#E3BE68"/>
    <text x="568" y="244" class="eyebrow" fill="#946100">TARGET WAF</text>
    <text x="568" y="276" class="body" fill="#17324D">100 requisições por IP / 5 min</text>
    <text x="568" y="300" class="small" fill="#557086">bloqueio por taxa, agregado por IP</text>
    <rect x="1000" y="214" width="512" height="92" rx="14" fill="#FFF1F5" stroke="#E7A7BE"/>
    <text x="1024" y="244" class="eyebrow" fill="#B41759">SEMÂNTICA</text>
    <text x="1024" y="276" class="body" fill="#17324D">MELHOR ESFORÇO</text>
    <text x="1024" y="300" class="small" fill="#557086">targets não implicam 429 determinístico</text>
  </g>

  <g class="sans" filter="url(#shadow)">
    <rect x="64" y="372" width="704" height="318" rx="20" fill="#FFFFFF" stroke="#8FC3EE" stroke-width="2"/>
    <text x="96" y="416" class="eyebrow" fill="#1168BD">RAJADA GET ASSINADA</text>
    <text x="96" y="456" class="cardTitle" fill="#17324D">80 GETs assinados iniciados em 834 ms</text>
    <rect x="96" y="486" width="288" height="112" rx="16" fill="#FFF0EF"/>
    <text x="120" y="528" class="metric" fill="#C2362B">80 × 503</text>
    <text x="120" y="560" class="body" fill="#76514B">resposta observada</text>
    <rect x="408" y="486" width="150" height="112" rx="16" fill="#F2F6FA"/>
    <text x="432" y="528" class="metric" fill="#526F87">0 × 429</text>
    <text x="432" y="560" class="body" fill="#557086">sem throttle</text>
    <rect x="582" y="486" width="154" height="112" rx="16" fill="#F2F6FA"/>
    <text x="606" y="528" class="metric" fill="#526F87">0</text>
    <text x="606" y="560" class="body" fill="#557086">datapoints Throttle</text>
    <path class="flow" d="M248 630 H486"/>
    <rect x="500" y="610" width="236" height="56" rx="14" fill="#FFF5DF" stroke="#E3BE68"/>
    <text x="528" y="645" class="cardTitle" fill="#775200">nova tentativa: WAF → 403</text>
  </g>

  <g class="sans" filter="url(#shadow)">
    <rect x="832" y="372" width="704" height="318" rx="20" fill="#FFFFFF" stroke="#A8D8C7" stroke-width="2"/>
    <text x="864" y="416" class="eyebrow" fill="#1F7A63">RAJADA POST SEGURA ASSINADA</text>
    <text x="864" y="456" class="cardTitle" fill="#17324D">20 POSTs assinados no endpoint de criação</text>
    <rect x="864" y="486" width="288" height="112" rx="16" fill="#FFF5DF"/>
    <text x="888" y="528" class="metric" fill="#946100">20 × 400</text>
    <text x="888" y="560" class="body" fill="#765C27">payload seguro inválido</text>
    <rect x="1176" y="486" width="150" height="112" rx="16" fill="#F2F6FA"/>
    <text x="1200" y="528" class="metric" fill="#526F87">0 × 429</text>
    <text x="1200" y="560" class="body" fill="#557086">sem throttle</text>
    <rect x="864" y="622" width="640" height="44" rx="12" fill="#EDF6FF"/>
    <text x="888" y="650" class="small" fill="#17324D">DELETE não executado: exigiria reserva persistida e teria efeito de estado.</text>
  </g>

  <g class="sans">
    <rect x="64" y="728" width="1472" height="82" rx="18" fill="#102A43"/>
    <text x="94" y="762" class="eyebrow" fill="#9FC8F3">LEITURA CORRETA</text>
    <text x="94" y="792" class="body" fill="#FFFFFF">WAF e API Gateway reduzem tráfego antes do compute. A distribuição observada não é admissão determinística, não é teste DDoS e não é capacidade sustentável.</text>
  </g>
</svg>
