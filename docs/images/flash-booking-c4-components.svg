<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500" role="img" aria-labelledby="title desc">
  <title id="title">Flash Booking — C4 Model, nível de componentes</title>
  <desc id="desc">Componentes reais dos perfis query-api, command-api e worker, integrações, padrões de resiliência e observabilidade.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#45637f"/></marker>
    <marker id="arrowAsync" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#276fb8"/></marker>
    <style>
      .bg{fill:#f6f8fb}.title{font:700 34px Arial,sans-serif;fill:#17324d}.subtitle{font:17px Arial,sans-serif;fill:#607284}.boundary{fill:#fff;stroke:#8698aa;stroke-width:2}.boundaryHead{fill:#edf2f7}.boundaryTitle{font:700 22px Arial,sans-serif;fill:#17324d}.boundarySub{font:14px Arial,sans-serif;fill:#64778a}.component{fill:#e9f2fb;stroke:#2d70b3;stroke-width:1.8}.componentTitle{font:700 16px Arial,sans-serif;fill:#17324d}.componentText{font:14px Arial,sans-serif;fill:#344c62}.adapter{fill:#f0f3f6;stroke:#8a9aaa;stroke-width:1.6}.adapterTitle{font:700 15px Arial,sans-serif;fill:#263f55}.adapterText{font:13px Arial,sans-serif;fill:#4b6073}.external{fill:#edf1f5;stroke:#778b9e;stroke-width:1.8}.externalTitle{font:700 16px Arial,sans-serif;fill:#203b53}.externalText{font:13px Arial,sans-serif;fill:#496074}.flow{fill:none;stroke:#45637f;stroke-width:2;marker-end:url(#arrow)}.async{fill:none;stroke:#276fb8;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrowAsync)}.event{fill:none;stroke:#70869a;stroke-width:1.8;stroke-dasharray:3 5;marker-end:url(#arrow)}.label{font:13px Arial,sans-serif;fill:#425a70}.small{font:12px Arial,sans-serif;fill:#597084}.section{fill:#fff;stroke:#a8b5c1;stroke-width:1.5}.sectionHead{font:700 18px Arial,sans-serif;fill:#17324d}.sectionText{font:14px Arial,sans-serif;fill:#344c62}.junction{fill:#45637f}.client{fill:#e4edf5;stroke:#66839e;stroke-width:2}.clientTitle{font:700 17px Arial,sans-serif;fill:#17324d}
    </style>
  </defs>
  <rect width="2000" height="1500" class="bg"/>
  <text x="70" y="60" class="title">Flash Booking — C4 Model • Nível 3: Componentes</text>
  <text x="70" y="91" class="subtitle">Três runtimes do mesmo código Java; não há chamada direta entre eles — a coordenação ocorre por PostgreSQL, outbox, SQS e cache compartilhado.</text>

  <rect x="760" y="125" width="480" height="72" rx="8" class="client"/>
  <text x="1000" y="154" text-anchor="middle" class="clientTitle">Cliente da API</text>
  <text x="1000" y="179" text-anchor="middle" class="componentText">HTTPS + IAM/SigV4 • roteamento por método e caminho</text>
  <path d="M900 197 V222 H355 V248" class="flow"/><text x="553" y="216" class="label">GET /events/{id} · GET /reservations/{id}</text>
  <path d="M1100 197 V222 H1000 V248" class="flow"/><text x="1114" y="216" class="label">POST / DELETE</text>

  <rect x="50" y="250" width="610" height="650" rx="12" class="boundary"/>
  <rect x="51" y="251" width="608" height="70" rx="11" class="boundaryHead"/>
  <text x="80" y="280" class="boundaryTitle">query-api</text><text x="80" y="304" class="boundarySub">Responsabilidade: consultas de eventos e reservas</text>
  <rect x="80" y="350" width="550" height="82" rx="7" class="component"/>
  <text x="100" y="379" class="componentTitle">Controllers HTTP</text><text x="100" y="405" class="componentText">EventController · ReservationQueryController</text>
  <rect x="80" y="472" width="550" height="104" rx="7" class="component"/>
  <text x="100" y="501" class="componentTitle">Casos de consulta</text><text x="100" y="527" class="componentText">GetEventService · GetReservationService</text><text x="100" y="551" class="adapterText">cache-aside; PostgreSQL permanece como fonte de verdade</text>
  <rect x="80" y="625" width="255" height="150" rx="7" class="adapter"/>
  <text x="100" y="654" class="adapterTitle">Adapter de cache</text><text x="100" y="680" class="adapterText">RedisEventAvailabilityCache</text><text x="100" y="702" class="adapterText">RedisReservationCache</text><text x="100" y="735" class="small">Portas: EventAvailabilityCache</text><text x="100" y="754" class="small">e ReservationCache</text>
  <rect x="375" y="625" width="255" height="150" rx="7" class="adapter"/>
  <text x="395" y="654" class="adapterTitle">Adapters JDBC</text><text x="395" y="680" class="adapterText">EventPersistenceAdapter</text><text x="395" y="702" class="adapterText">JdbcReservationPersistenceAdapter</text><text x="395" y="735" class="small">Portas: EventReader</text><text x="395" y="754" class="small">e ReservationReader</text>
  <path d="M355 432 V472" class="flow"/>
  <path d="M355 576 V600 H207 V625" class="flow"/><path d="M355 600 H502 V625" class="flow"/><circle cx="355" cy="600" r="4" class="junction"/>
  <rect x="80" y="815" width="550" height="54" rx="6" class="external"/><text x="355" y="838" text-anchor="middle" class="externalTitle">Dependências externas</text><text x="355" y="859" text-anchor="middle" class="externalText">Valkey: get/put • PostgreSQL: fallback e leitura autoritativa</text>
  <path d="M207 775 V815" class="flow"/><path d="M502 775 V815" class="flow"/>

  <rect x="695" y="250" width="610" height="650" rx="12" class="boundary"/>
  <rect x="696" y="251" width="608" height="70" rx="11" class="boundaryHead"/>
  <text x="725" y="280" class="boundaryTitle">command-api</text><text x="725" y="304" class="boundarySub">Responsabilidade: regras, consistência e comandos idempotentes</text>
  <rect x="725" y="350" width="550" height="82" rx="7" class="component"/>
  <text x="745" y="376" class="componentTitle">Controllers HTTP</text><text x="745" y="399" class="componentText">EventCommandController · ReservationController</text><text x="745" y="418" class="componentText">ReservationCancellationController</text>
  <rect x="725" y="472" width="255" height="104" rx="7" class="component"/>
  <text x="745" y="501" class="componentTitle">Idempotência</text><text x="745" y="527" class="componentText">PersistentIdempotencyService</text><text x="745" y="551" class="adapterText">IdempotencyStore</text>
  <rect x="1020" y="472" width="255" height="104" rx="7" class="component"/>
  <text x="1040" y="496" class="componentTitle">Casos de uso</text><text x="1040" y="519" class="componentText">CreateEventService</text><text x="1040" y="540" class="componentText">CreateReservationService</text><text x="1040" y="561" class="componentText">CancelReservationService</text>
  <rect x="725" y="625" width="255" height="150" rx="7" class="adapter"/>
  <text x="745" y="654" class="adapterTitle">Adapters JDBC</text><text x="745" y="680" class="adapterText">JdbcIdempotencyStore</text><text x="745" y="702" class="adapterText">Event / ReservationPersistenceAdapter</text><text x="745" y="724" class="adapterText">JdbcInventoryOperations</text><text x="745" y="752" class="small">TX inclui reserva + inventário + outbox</text>
  <rect x="1020" y="625" width="255" height="150" rx="7" class="adapter"/>
  <text x="1040" y="654" class="adapterTitle">Invalidação pós-commit</text><text x="1040" y="680" class="adapterText">EventAvailabilityInvalidationListener</text><text x="1040" y="702" class="adapterText">ReservationCacheInvalidationListener</text><text x="1040" y="735" class="small">Eventos: EventAvailabilityChanged</text><text x="1040" y="754" class="small">e ReservationChanged</text>
  <path d="M1000 432 V450 H852 V472" class="flow"/><path d="M1000 450 H1147 V472" class="flow"/><circle cx="1000" cy="450" r="4" class="junction"/>
  <path d="M852 576 V625" class="flow"/><path d="M1147 576 V625" class="event"/>
  <rect x="725" y="815" width="550" height="54" rx="6" class="external"/><text x="1000" y="838" text-anchor="middle" class="externalTitle">Dependências externas</text><text x="1000" y="859" text-anchor="middle" class="externalText">PostgreSQL: transação + outbox • Valkey: evict best-effort após commit</text>
  <path d="M852 775 V815" class="flow"/><path d="M1147 775 V815" class="event"/>

  <rect x="1340" y="250" width="610" height="650" rx="12" class="boundary"/>
  <rect x="1341" y="251" width="608" height="70" rx="11" class="boundaryHead"/>
  <text x="1370" y="280" class="boundaryTitle">worker</text><text x="1370" y="304" class="boundarySub">Responsabilidade: publicação, expiração e notificação</text>
  <rect x="1370" y="350" width="550" height="82" rx="7" class="component"/>
  <text x="1390" y="376" class="componentTitle">Entradas agendadas e SQS</text><text x="1390" y="399" class="componentText">OutboxSqsPublisher · SqsExpirationConsumer</text><text x="1390" y="418" class="componentText">SqsReservationCreatedConsumer</text>
  <rect x="1370" y="472" width="255" height="104" rx="7" class="component"/>
  <text x="1390" y="501" class="componentTitle">Expiração</text><text x="1390" y="527" class="componentText">ExpireReservationService</text><text x="1390" y="551" class="componentText">ExpirationReconciler</text>
  <rect x="1665" y="472" width="255" height="104" rx="7" class="component"/>
  <text x="1685" y="501" class="componentTitle">Notificação</text><text x="1685" y="527" class="componentText">ReservationEmailService</text><text x="1685" y="551" class="componentText">NotificationDeliveryStore</text>
  <rect x="1370" y="625" width="170" height="150" rx="7" class="adapter"/>
  <text x="1388" y="654" class="adapterTitle">Persistência</text><text x="1388" y="680" class="adapterText">JdbcOutboxEventStore</text><text x="1388" y="702" class="adapterText">JdbcNotification-</text><text x="1388" y="721" class="adapterText">DeliveryStore</text><text x="1388" y="750" class="small">reservas e inventário</text>
  <rect x="1560" y="625" width="170" height="150" rx="7" class="adapter"/>
  <text x="1578" y="654" class="adapterTitle">Mensageria</text><text x="1578" y="680" class="adapterText">SqsClient</text><text x="1578" y="704" class="adapterText">2 filas + 2 DLQs</text><text x="1578" y="735" class="small">publica e consome</text><text x="1578" y="754" class="small">at-least-once</text>
  <rect x="1750" y="625" width="170" height="150" rx="7" class="adapter"/>
  <text x="1768" y="654" class="adapterTitle">E-mail</text><text x="1768" y="680" class="adapterText">SesReservation-</text><text x="1768" y="699" class="adapterText">EmailSender</text><text x="1768" y="735" class="small">Amazon SES</text><text x="1768" y="754" class="small">timeout 3 s</text>
  <path d="M1645 432 V450 H1497 V472" class="flow"/><path d="M1645 450 H1792 V472" class="flow"/><circle cx="1645" cy="450" r="4" class="junction"/>
  <path d="M1497 576 V600 H1455 V625" class="flow"/><path d="M1497 600 H1645 V625" class="async"/>
  <path d="M1792 576 V600 H1835 V625" class="flow"/>
  <rect x="1370" y="815" width="550" height="54" rx="6" class="external"/><text x="1645" y="838" text-anchor="middle" class="externalTitle">Dependências externas</text><text x="1645" y="859" text-anchor="middle" class="externalText">PostgreSQL + SQS Expiration/Notification + DLQs + Amazon SES</text>
  <path d="M1455 775 V815" class="flow"/><path d="M1645 775 V815" class="async"/><path d="M1835 775 V815" class="flow"/>

  <rect x="50" y="930" width="1900" height="88" rx="8" class="section"/>
  <text x="80" y="960" class="sectionHead">Contrato entre os três runtimes</text>
  <text x="80" y="989" class="sectionText">command-api confirma a transação e grava o outbox; worker publica e consome eventos; query-api observa o estado confirmado pelo PostgreSQL e acelera leituras via Valkey.</text>
  <line x1="80" y1="1003" x2="130" y2="1003" class="flow"/><text x="142" y="1008" class="small">síncrono</text><line x1="255" y1="1003" x2="305" y2="1003" class="async"/><text x="317" y="1008" class="small">SQS / evento</text><line x1="460" y1="1003" x2="510" y2="1003" class="event"/><text x="522" y="1008" class="small">após commit</text>

  <rect x="50" y="1050" width="1900" height="205" rx="8" class="section"/>
  <text x="80" y="1084" class="sectionHead">Padrões de resiliência implementados</text>
  <rect x="80" y="1105" width="570" height="118" rx="7" class="component"/>
  <text x="100" y="1133" class="componentTitle">Leitura degradável</text><text x="100" y="1158" class="componentText">Cache-aside • timeouts Valkey 100 ms • fallback PostgreSQL</text><text x="100" y="1181" class="componentText">Circuito: 5 falhas / 10 s • bulkhead: 5 fallbacks • excesso → 503</text><text x="100" y="1204" class="small">A falha do cache não torna o target HTTP unhealthy.</text>
  <rect x="715" y="1105" width="570" height="118" rx="7" class="component"/>
  <text x="735" y="1133" class="componentTitle">Consistência do comando</text><text x="735" y="1158" class="componentText">Idempotência persistente • update condicional contra oversell</text><text x="735" y="1181" class="componentText">Transação única: inventário + reserva + outbox</text><text x="735" y="1204" class="small">Invalidação de cache é best-effort e acontece AFTER_COMMIT.</text>
  <rect x="1350" y="1105" width="570" height="118" rx="7" class="component"/>
  <text x="1370" y="1133" class="componentTitle">Processamento assíncrono</text><text x="1370" y="1158" class="componentText">Entrega at-least-once • retry por polling • DLQ após 5 recebimentos</text><text x="1370" y="1181" class="componentText">Deduplicação de e-mail • expiração idempotente • reconciliador</text><text x="1370" y="1204" class="small">Falha após envio pode duplicar; não há promessa de exactly-once.</text>

  <rect x="50" y="1285" width="1900" height="165" rx="8" class="section"/>
  <text x="80" y="1319" class="sectionHead">Observabilidade implementada</text>
  <text x="80" y="1351" class="sectionText">• X-Correlation-ID no HTTP e outboxEventId no fluxo assíncrono  • CloudWatch Logs separados por runtime + access log JSON (7 dias)</text>
  <text x="80" y="1381" class="sectionText">• ECS Container Insights  • /actuator/health interno + health checks do ALB  • métricas de API Gateway e WAF</text>
  <text x="80" y="1411" class="sectionText">• Alarmes atuais: API 5xx, throttling e targets unhealthy  • Dashboard operacional da demo</text>
  <rect x="1555" y="1325" width="365" height="78" rx="7" class="adapter"/><text x="1737" y="1354" text-anchor="middle" class="adapterTitle">Limite atual</text><text x="1737" y="1378" text-anchor="middle" class="adapterText">Sem tracing distribuído ou</text><text x="1737" y="1397" text-anchor="middle" class="adapterText">métricas de negócio customizadas</text>
</svg>
