<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc">
  <title id="title">Flash Booking — arquitetura AWS high-load</title>
  <desc id="desc">Arquitetura alvo Multi-AZ com edge protegido, três serviços ECS escaláveis, dados, mensageria, resiliência e observabilidade.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#345b7c"/></marker>
    <marker id="asyncArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2871b8"/></marker>
    <style>
      .bg{fill:#f6f8fb}.title{font:700 34px Arial,sans-serif;fill:#17324d}.subtitle{font:16px Arial,sans-serif;fill:#607284}.zone{fill:#fff;stroke:#8fa0b0;stroke-width:1.8}.zoneHead{fill:#e6edf4}.zoneTitle{font:700 20px Arial,sans-serif;fill:#17324d}.zoneSub{font:13px Arial,sans-serif;fill:#5c7184}.card{fill:#e9f2fb;stroke:#2d70b3;stroke-width:1.7}.gray{fill:#eef1f4;stroke:#7d90a2;stroke-width:1.6}.cardTitle{font:700 16px Arial,sans-serif;fill:#1f3c55}.cardText{font:13px Arial,sans-serif;fill:#415a70}.small{font:12px Arial,sans-serif;fill:#587084}.badge{fill:#dbeafa;stroke:#79a7d2;stroke-width:1}.badgeText{font:700 12px Arial,sans-serif;fill:#255b88}.sync{fill:none;stroke:#345b7c;stroke-width:2.2;marker-end:url(#arrow)}.async{fill:none;stroke:#2871b8;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#asyncArrow)}.event{fill:none;stroke:#647e96;stroke-width:1.9;stroke-dasharray:3 5;marker-end:url(#arrow)}.label{font:12px Arial,sans-serif;fill:#3f586e}.section{fill:#fff;stroke:#98a8b7;stroke-width:1.6}.sectionTitle{font:700 18px Arial,sans-serif;fill:#17324d}.sectionText{font:13px Arial,sans-serif;fill:#3e576d}.ribbon{fill:#e5edf5;stroke:#6e8aa3;stroke-width:1.5}.ribbonText{font:700 14px Arial,sans-serif;fill:#294b68}.port{fill:#fff;stroke:#8ea1b3;stroke-width:1.2}.portText{font:12px Arial,sans-serif;fill:#40596f}
    </style>
  </defs>
  <rect width="2000" height="1400" class="bg"/>
  <text x="55" y="55" class="title">Flash Booking — Arquitetura AWS High-Load</text>
  <text x="55" y="84" class="subtitle">Arquitetura-alvo: escala independente de leitura, comandos e processamento assíncrono; capacidade e SLOs exigem validação por teste de carga.</text>
  <rect x="1660" y="30" width="285" height="56" rx="7" class="badge"/><text x="1802" y="53" text-anchor="middle" class="cardTitle">Arquitetura-alvo</text><text x="1802" y="73" text-anchor="middle" class="small">sem números de capacidade presumidos</text>

  <rect x="55" y="110" width="1890" height="54" rx="7" class="ribbon"/>
  <text x="80" y="143" class="ribbonText">AWS Region • VPC privada • pelo menos 2 AZs • workloads sem IP público • rotas simétricas e NAT por AZ</text>
  <rect x="1440" y="120" width="220" height="34" rx="5" class="port"/><text x="1550" y="142" text-anchor="middle" class="portText">AZ-a: app + dados</text>
  <rect x="1680" y="120" width="220" height="34" rx="5" class="port"/><text x="1790" y="142" text-anchor="middle" class="portText">AZ-b: app + dados</text>

  <!-- Edge -->
  <rect x="55" y="190" width="300" height="760" rx="10" class="zone"/>
  <rect x="56" y="191" width="298" height="62" rx="9" class="zoneHead"/><text x="80" y="219" class="zoneTitle">Edge</text><text x="80" y="240" class="zoneSub">único ponto público</text>
  <rect x="85" y="285" width="240" height="90" rx="7" class="gray"/>
  <text x="205" y="315" text-anchor="middle" class="cardTitle">Cliente da API</text><text x="205" y="340" text-anchor="middle" class="cardText">credenciais temporárias</text><text x="205" y="362" text-anchor="middle" class="cardText">HTTPS + IAM/SigV4</text>
  <rect x="85" y="425" width="240" height="190" rx="7" class="card"/>
  <text x="205" y="455" text-anchor="middle" class="cardTitle">WAF + API Gateway REST</text>
  <text x="105" y="484" class="cardText">• resource policy + CIDRs</text><text x="105" y="508" class="cardText">• role com menor privilégio</text><text x="105" y="532" class="cardText">• rate limit por IP</text><text x="105" y="556" class="cardText">• throttling por rota</text><text x="105" y="580" class="small">excesso é rejeitado antes do core</text>
  <rect x="85" y="665" width="240" height="112" rx="7" class="gray"/>
  <text x="205" y="695" text-anchor="middle" class="cardTitle">VPC Link v2</text><text x="205" y="720" text-anchor="middle" class="cardText">PrivateLink</text><text x="205" y="744" text-anchor="middle" class="small">destino: ALB interno</text>
  <rect x="85" y="825" width="240" height="92" rx="7" class="gray"/>
  <text x="105" y="852" class="cardTitle">Controles de rede</text><text x="105" y="877" class="cardText">SG mínimo • TLS/KMS</text><text x="105" y="899" class="cardText">sem entrada pública no core</text>
  <path d="M205 375 V425" class="sync"/><path d="M205 615 V665" class="sync"/>

  <!-- Core -->
  <rect x="395" y="190" width="790" height="760" rx="10" class="zone"/>
  <rect x="396" y="191" width="788" height="62" rx="9" class="zoneHead"/><text x="420" y="219" class="zoneTitle">Core do produto — ECS Fargate</text><text x="420" y="240" class="zoneSub">mesma imagem Java; serviços, tasks e autoscaling independentes</text>
  <rect x="435" y="285" width="710" height="80" rx="7" class="gray"/>
  <text x="455" y="313" class="cardTitle">Application Load Balancer interno</text><text x="455" y="338" class="cardText">health checks em /actuator/health • target groups por serviço • roteamento por caminho/método</text>
  <rect x="435" y="405" width="710" height="120" rx="7" class="card"/>
  <text x="460" y="435" class="cardTitle">Query API — 2..N tasks Multi-AZ</text><text x="460" y="461" class="cardText">GET /events/{id} • GET /reservations/{id}</text><text x="460" y="486" class="cardText">cache-aside; fallback PostgreSQL protegido por circuito e bulkhead</text>
  <rect x="915" y="430" width="200" height="60" rx="6" class="badge"/><text x="1015" y="454" text-anchor="middle" class="badgeText">Escala por leitura</text><text x="1015" y="475" text-anchor="middle" class="small">RPS · latência · CPU</text>
  <rect x="435" y="565" width="710" height="120" rx="7" class="card"/>
  <text x="460" y="595" class="cardTitle">Command API — 2..N tasks Multi-AZ</text><text x="460" y="621" class="cardText">POST /events • POST /events/{id}/reservations • DELETE /reservations/{id}</text><text x="460" y="646" class="cardText">idempotência persistente • update condicional • transação + outbox</text>
  <rect x="915" y="590" width="200" height="60" rx="6" class="badge"/><text x="1015" y="614" text-anchor="middle" class="badgeText">Escala por comandos</text><text x="1015" y="635" text-anchor="middle" class="small">RPS · latência · CPU</text>
  <rect x="435" y="725" width="710" height="120" rx="7" class="card"/>
  <text x="460" y="755" class="cardTitle">Worker — 2..N tasks Multi-AZ</text><text x="460" y="781" class="cardText">publica outbox • consome 2 filas • expira • reconcilia • envia e-mail</text><text x="460" y="806" class="cardText">concorrência de expiração e notificação deve permanecer isolada</text>
  <rect x="915" y="750" width="200" height="60" rx="6" class="badge"/><text x="1015" y="774" text-anchor="middle" class="badgeText">Escala assíncrona</text><text x="1015" y="795" text-anchor="middle" class="small">backlog/task · idade</text>
  <rect x="435" y="875" width="710" height="48" rx="6" class="gray"/><text x="790" y="904" text-anchor="middle" class="cardText">ECS deployment circuit breaker + rollback • cooldowns e limites protegem o banco</text>
  <path d="M325 721 H375 V325 H435" class="sync"/><text x="337" y="699" class="label">privado</text>
  <path d="M470 365 V390 H455 V405" class="sync"/><text x="480" y="391" class="label">GET</text>
  <path d="M530 365 V545 H455 V565" class="sync"/><text x="540" y="548" class="label">POST / DELETE</text>

  <!-- Data and messaging -->
  <rect x="1225" y="190" width="720" height="760" rx="10" class="zone"/>
  <rect x="1226" y="191" width="718" height="62" rx="9" class="zoneHead"/><text x="1250" y="219" class="zoneTitle">Dados e mensageria</text><text x="1250" y="240" class="zoneSub">Multi-AZ e privados; filas independentes por responsabilidade</text>
  <rect x="1270" y="405" width="630" height="112" rx="7" class="card"/>
  <text x="1295" y="435" class="cardTitle">ElastiCache for Valkey — Multi-AZ</text><text x="1295" y="461" class="cardText">Primary + réplica com failover • criptografia • cache nunca autoriza reserva</text><text x="1295" y="486" class="small">TTL curto + invalidação após commit</text>
  <rect x="1270" y="565" width="630" height="148" rx="7" class="card"/>
  <text x="1295" y="595" class="cardTitle">RDS Proxy + Aurora PostgreSQL</text><text x="1295" y="621" class="cardText">read-only para consultas • read-write para comandos e worker</text><text x="1295" y="645" class="cardText">writer + reader Multi-AZ • ACUs e conexões limitadas</text><text x="1295" y="669" class="cardText">fonte de verdade: inventário, reservas, idempotência e outbox</text><text x="1295" y="693" class="small">lock waits e saturação orientam controle de admissão</text>
  <rect x="1270" y="745" width="390" height="148" rx="7" class="card"/>
  <text x="1295" y="775" class="cardTitle">Amazon SQS — filas + DLQs</text>
  <rect x="1290" y="795" width="165" height="76" rx="6" class="gray"/><text x="1372" y="819" text-anchor="middle" class="cardTitle">Expiration + DLQ</text><text x="1372" y="842" text-anchor="middle" class="cardText">redrive 5x</text><text x="1372" y="861" text-anchor="middle" class="small">14 dias</text>
  <rect x="1470" y="795" width="170" height="76" rx="6" class="gray"/><text x="1555" y="819" text-anchor="middle" class="cardTitle">Notification + DLQ</text><text x="1555" y="842" text-anchor="middle" class="cardText">redrive 5x</text><text x="1555" y="861" text-anchor="middle" class="small">14 dias</text>
  <rect x="1680" y="745" width="220" height="148" rx="7" class="gray"/>
  <text x="1705" y="775" class="cardTitle">Amazon SES</text><text x="1705" y="805" class="cardText">e-mail assíncrono</text><text x="1705" y="829" class="cardText">timeout 3 s</text><text x="1705" y="853" class="small">falha não altera</text><text x="1705" y="872" class="small">a reserva</text>

  <!-- Service to data paths: distinct lanes -->
  <path d="M1145 445 H1270" class="sync"/><text x="1160" y="437" class="label">cache-aside</text>
  <path d="M1145 485 H1190 V595 H1270" class="sync"/><text x="1155" y="477" class="label">read-only</text>
  <path d="M1145 605 H1175 V505 H1270" class="event"/><text x="1184" y="497" class="label">evict pós-commit</text>
  <path d="M1145 645 H1270" class="sync"/><text x="1160" y="637" class="label">read-write</text>
  <path d="M1145 755 H1180 V685 H1270" class="sync"/><text x="1152" y="746" class="label">outbox/reconciliação</text>
  <path d="M1145 785 H1270" class="async"/><text x="1160" y="777" class="label">publica/consome</text>
  <path d="M1145 815 H1210 V915 H1790 V893" class="sync"/><text x="1222" y="907" class="label">e-mail</text>

  <!-- Resilience and observability -->
  <rect x="55" y="985" width="1120" height="345" rx="9" class="section"/>
  <text x="80" y="1018" class="sectionTitle">Resiliência em camadas</text>
  <text x="80" y="1051" class="sectionText">Edge</text><text x="220" y="1051" class="sectionText">WAF + throttling por rota + rejeição antecipada de excesso</text>
  <text x="80" y="1083" class="sectionText">Query</text><text x="220" y="1083" class="sectionText">cache-aside • timeout 100 ms • circuito 5 falhas/10 s • bulkhead 5 • fallback ou 503</text>
  <text x="80" y="1115" class="sectionText">Command</text><text x="220" y="1115" class="sectionText">idempotência persistente • update condicional • transação + transactional outbox</text>
  <text x="80" y="1147" class="sectionText">Worker</text><text x="220" y="1147" class="sectionText">at-least-once • retry por polling • DLQs • deduplicação • reconciliador de expiração</text>
  <text x="80" y="1179" class="sectionText">Runtime</text><text x="220" y="1179" class="sectionText">timeouts AWS 3 s • deployment circuit breaker + rollback • escala limitada pela capacidade do banco</text>
  <rect x="80" y="1210" width="1055" height="86" rx="6" class="gray"/><text x="100" y="1238" class="cardTitle">Sem promessa de exactly-once</text><text x="100" y="1263" class="cardText">Outbox e consumidores toleram repetição; crash entre efeito externo e confirmação ainda pode duplicar mensagem ou e-mail.</text><text x="100" y="1285" class="small">A reserva continua protegida por transições condicionais e reconciliação.</text>

  <rect x="1210" y="985" width="735" height="345" rx="9" class="section"/>
  <text x="1235" y="1018" class="sectionTitle">Observabilidade</text>
  <text x="1235" y="1051" class="sectionText">• CloudWatch Logs por serviço + access log JSON da API (7 dias)</text>
  <text x="1235" y="1083" class="sectionText">• ECS Container Insights e métricas de API Gateway/WAF</text>
  <text x="1235" y="1115" class="sectionText">• /actuator/health interno e health checks do ALB</text>
  <text x="1235" y="1147" class="sectionText">• Alarmes atuais: 5xx, throttling e targets unhealthy</text>
  <text x="1235" y="1179" class="sectionText">• X-Correlation-ID no HTTP; outboxEventId no assíncrono</text>
  <rect x="1235" y="1210" width="670" height="86" rx="6" class="gray"/><text x="1255" y="1238" class="cardTitle">Para operar high-load</text><text x="1255" y="1263" class="cardText">Instrumentar e alarmar: p95/p99, hit rate, conexões/locks, backlog/idade e DLQs.</text><text x="1255" y="1285" class="small">Tracing distribuído e métricas customizadas ainda não existem no escopo atual.</text>

  <line x1="70" y1="1360" x2="120" y2="1360" class="sync"/><text x="132" y="1365" class="small">chamada síncrona</text>
  <line x1="300" y1="1360" x2="350" y2="1360" class="async"/><text x="362" y="1365" class="small">mensagem SQS</text>
  <line x1="510" y1="1360" x2="560" y2="1360" class="event"/><text x="572" y="1365" class="small">evento após commit</text>
</svg>
