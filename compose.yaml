name: flash-booking

x-application: &application
  build:
    context: .
  image: flash-booking:local
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flash_booking
    SPRING_DATASOURCE_USERNAME: flash_booking
    SPRING_DATASOURCE_PASSWORD: flash_booking
    SPRING_DATA_REDIS_HOST: valkey
    SPRING_DATA_REDIS_PORT: 6379
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flash_booking
      POSTGRES_USER: flash_booking
      POSTGRES_PASSWORD: flash_booking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash_booking -d flash_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.0-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8025/api/v1/messages"]
      interval: 5s
      timeout: 3s
      retries: 10

  query-api:
    <<: *application
    environment:
      SPRING_PROFILES_ACTIVE: query-api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flash_booking
      SPRING_DATASOURCE_USERNAME: flash_booking
      SPRING_DATASOURCE_PASSWORD: flash_booking
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8081:8080"

  command-api:
    <<: *application
    environment:
      SPRING_PROFILES_ACTIVE: command-api
      RESERVATION_HOLD_DURATION: 10s
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flash_booking
      SPRING_DATASOURCE_USERNAME: flash_booking
      SPRING_DATASOURCE_PASSWORD: flash_booking
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8082:8080"

  worker:
    <<: *application
    environment:
      SPRING_PROFILES_ACTIVE: worker
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_PUBLISHER_EXPIRATION_QUEUE_URL: http://localstack:4566/000000000000/flash-booking-expiration
      OUTBOX_PUBLISHER_NOTIFICATION_QUEUE_URL: http://localstack:4566/000000000000/flash-booking-notification
      OUTBOX_PUBLISHER_REGION: us-east-1
      OUTBOX_PUBLISHER_ENDPOINT: http://localstack:4566
      EXPIRATION_CONSUMER_ENABLED: "true"
      EXPIRATION_CONSUMER_QUEUE_URL: http://localstack:4566/000000000000/flash-booking-expiration
      NOTIFICATION_CONSUMER_ENABLED: "true"
      NOTIFICATION_CONSUMER_QUEUE_URL: http://localstack:4566/000000000000/flash-booking-notification
      NOTIFICATION_EMAIL_PROVIDER: smtp
      NOTIFICATION_EMAIL_FROM_ADDRESS: reservations@flash-booking.local
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flash_booking
      SPRING_DATASOURCE_USERNAME: flash_booking
      SPRING_DATASOURCE_PASSWORD: flash_booking
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  command-api-concurrency:
    <<: *application
    profiles: ["concurrency"]
    environment:
      SPRING_PROFILES_ACTIVE: command-api
      RESERVATION_HOLD_DURATION: 10s
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flash_booking
      SPRING_DATASOURCE_USERNAME: flash_booking
      SPRING_DATASOURCE_PASSWORD: flash_booking
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
    deploy:
      replicas: 2
